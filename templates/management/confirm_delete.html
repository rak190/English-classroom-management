{% extends 'base.html' %}

{% block title %}{{ title }} - ECMS{% endblock %}
{% block header_title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mb-4 border-danger shadow-sm">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0 text-white"><i class="bx bx-error me-2"></i> Confirm Deletion</h5>
            </div>
            <div class="card-body mt-4">
                <p class="fs-5">Are you sure you want to delete <strong>{{ object }}</strong>?</p>
                <p class="text-muted">This action cannot be undone.</p>
                
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2">Yes, Delete</button>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
